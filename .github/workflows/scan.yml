name: Scan recent packages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.2.4"

      - run: bun install

      - run: bun run src/scanner.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git diff --quiet data/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recent-high-risk.json data/security-feed.json data/recent-transfers.json data/incidents-feed.json
          git commit -m "chore: update scan results, feeds, and transfers"
          git push
